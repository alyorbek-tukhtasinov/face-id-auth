[project]
name = "faceid-next"
version = "2.0.0"
description = "Lokal, yangi avlod yuz orqali autentifikatsiya: aktiv+passiv liveness, injection himoyasi, shifrlangan shablonlar"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "To'xtasinov Alyorbek" }]
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.10",
    "onnxruntime>=1.20",
    "mediapipe>=0.10.20",
    "PySide6>=6.7",
    "cryptography>=42",
    "keyring>=25",
    "argon2-cffi>=23.1",
    "cv2-enumerate-cameras>=1.1",
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
faceid = "faceid.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["faceid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108", "B905", "SIM105", "UP042"]
